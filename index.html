<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#f5f6fa">
  <title>Daylight — To-do list</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="app-shell">
    <header class="topbar"><a class="brand" href="#" aria-label="Daylight home"><span class="brand-mark">✳</span> daylight</a><span class="today" id="today"></span></header>
    <section class="welcome"><p class="eyebrow">YOUR SPACE, YOUR PACE</p><h1>Make room for<br><span>what matters.</span></h1><p class="welcome-copy">A little progress each day adds up to something big.</p></section>
    <section class="board" aria-label="Your tasks">
      <div class="board-heading"><div><h2>Today’s tasks</h2><p id="task-summary">Your next small win is waiting.</p></div><div class="progress-ring" aria-label="Task completion"><span id="progress-value">0%</span></div></div>
      <form class="task-form" id="task-form"><label class="sr-only" for="todo">Add a task</label><span class="add-icon" aria-hidden="true">＋</span><input id="todo" type="text" placeholder="What needs to get done?" maxlength="120" autocomplete="off"><label class="sr-only" for="type">Priority</label><select id="type" aria-label="Task priority"><option value="high">High</option><option value="medium" selected>Medium</option><option value="low">Low</option></select><button class="add-button" type="submit">Add task <span aria-hidden="true">↗</span></button></form>
      <div class="toolbar"><div class="filters" role="tablist" aria-label="Filter tasks"><button class="filter active" type="button" data-filter="all" role="tab" aria-selected="true">All <span id="all-count">0</span></button><button class="filter" type="button" data-filter="active" role="tab" aria-selected="false">To do</button><button class="filter" type="button" data-filter="completed" role="tab" aria-selected="false">Completed</button></div><label class="search"><span aria-hidden="true">⌕</span><input id="search" type="search" placeholder="Search tasks" aria-label="Search tasks"></label></div>
      <ul id="list" class="task-list" aria-live="polite"></ul>
      <div class="empty-state" id="empty-state"><span class="empty-icon">✦</span><strong id="empty-title">A fresh start.</strong><p id="empty-copy">Add a task above and make today count.</p></div>
      <footer class="board-footer"><span id="remaining-count">0 tasks left</span><button id="clear-completed" type="button" class="clear-button">Clear completed</button></footer>
    </section>
    <p class="page-note">Keep it simple. Keep it moving. <span>✦</span></p>
  </main>
  <script src="script.js"></script>
</body>
</html>
